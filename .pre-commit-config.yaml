repos:
  - repo: https://github.com/semgrep/pre-commit
    rev: "v1.180.0"
    hooks:
      - id: semgrep
        args:
          - "--config"
          - "auto"
          - "--error"
          - "--skip-unknown-extensions"

  - repo: https://github.com/gitleaks/gitleaks
    rev: "v8.30.0"
    hooks:
      - id: gitleaks